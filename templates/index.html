<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Ollama - Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="chat-container">
        <div class="header">
            <h1>💬 Chat Ollama</h1>
            <p id="status">🟡 Checking...</p>
        </div>
        <div id="chatWindow"></div>
        <div class="input-group">
            <input type="text" id="chatInput" placeholder="Ketik pesan...">
            <button id="sendButton">Send</button>
            <button id="clearButton">Clear</button>
        </div>
    </div>

    <script>
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const chatWindow = document.getElementById('chatWindow');
        const clearButton = document.getElementById('clearButton');
        const statusDiv = document.getElementById('status');

        // Check Ollama health on load
        window.addEventListener('load', () => {
            checkOllamaHealth();
        });

        async function checkOllamaHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                if (data.status === 'ok') {
                    statusDiv.textContent = '🟢 Ollama Ready';
                    statusDiv.style.color = '#28a745';
                } else {
                    statusDiv.textContent = '🔴 Ollama Offline';
                    statusDiv.style.color = '#dc3545';
                }
            } catch (error) {
                statusDiv.textContent = '🔴 Ollama Not Running';
                statusDiv.style.color = '#dc3545';
            }
        }

        // Send message event listeners
        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message to UI
            appendMessage(message, 'user');
            chatInput.value = '';
            chatInput.focus();

            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.id = 'loading-indicator';
            loadingDiv.innerHTML = '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
            chatWindow.appendChild(loadingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                
                // Remove loading indicator
                loadingDiv.remove();

                if (response.ok) {
                    appendMessage(data.response, 'bot');
                } else {
                    appendMessage('❌ Error: ' + (data.error || 'Unknown error'), 'bot');
                }
            } catch (error) {
                loadingDiv.remove();
                appendMessage('❌ Connection error: ' + error.message, 'bot');
            }
        }

        function appendMessage(msg, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = msg;
            
            messageDiv.appendChild(bubble);
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Clear chat history
        clearButton.addEventListener('click', () => {
            if (confirm('Clear all messages?')) {
                chatWindow.innerHTML = '';
            }
        });
    </script>
</body>
</html>
